name: Provenance Studio

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['provenance-studio/**', '.github/workflows/provenance-studio.yml']
  pull_request:
    branches: [ main ]
    paths: ['provenance-studio/**', '.github/workflows/provenance-studio.yml']

concurrency:
  group: provenance-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: provenance-studio

env:
  # Valeurs factices : le build n'appelle aucun service, il a seulement besoin
  # que les variables publiques existent.
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  check:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: provenance-studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:sql
      - run: npm run build
